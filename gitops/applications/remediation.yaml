apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: remediation-service
  namespace: argocd
spec:
  project: self-healing-platform
  source:
    repoURL: https://github.com/karthickk022/self-healing-platform
    path: remediation
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: remediation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
