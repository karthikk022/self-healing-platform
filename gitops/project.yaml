apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: self-healing-platform
  namespace: argocd
spec:
  description: Self-Healing Infrastructure Platform
  sourceRepos:
    - '*'
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  orphanedResources:
    warn: false
