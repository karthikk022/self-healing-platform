apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-service
  namespace: remediation
  labels:
    app: remediation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remediation-service
  template:
    metadata:
      labels:
        app: remediation-service
    spec:
      serviceAccountName: remediation-sa
      containers:
        - name: remediation
          image: ghcr.io/karthickk022/self-healing-platform/remediation-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: SCALE_UP_COUNT
              value: "5"
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: remediation-webhook-secret
                  key: secret
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: remediation-service
  namespace: remediation
spec:
  selector:
    app: remediation-service
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-sa
  namespace: remediation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: remediation-role
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: remediation-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: remediation-role
subjects:
  - kind: ServiceAccount
    name: remediation-sa
    namespace: remediation
---
apiVersion: v1
kind: Secret
metadata:
  name: remediation-webhook-secret
  namespace: remediation
  annotations:
    # Generate a random 32-char hex key: openssl rand -hex 16
    secret-generator: static
stringData:
  secret: "e7b2c1a8f94d63e2b0a7c3f59e81d42a"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-webhook-from-outside
  namespace: remediation
spec:
  podSelector:
    matchLabels:
      app: remediation-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
