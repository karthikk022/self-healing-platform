apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-service
  namespace: remediation
  labels:
    app: remediation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remediation-service
  template:
    metadata:
      labels:
        app: remediation-service
    spec:
      serviceAccountName: remediation-sa
      volumes:
        - name: code
          configMap:
            name: remediation-code
      containers:
        - name: remediation
          image: python:3.11-slim
          command: ["sh", "-c"]
          args:
            - |
              pip install --no-cache-dir fastapi uvicorn kubernetes requests -q 2>&1
              python /app/main.py
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: code
              mountPath: /app/main.py
              subPath: main.py
          env:
            - name: SCALE_UP_COUNT
              value: "5"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: remediation-service
  namespace: remediation
spec:
  selector:
    app: remediation-service
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-sa
  namespace: remediation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: remediation-role
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: remediation-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: remediation-role
subjects:
  - kind: ServiceAccount
    name: remediation-sa
    namespace: remediation
