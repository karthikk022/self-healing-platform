groups:
  - name: slo-rules
    interval: 30s
    rules:
      # SLI: Request success rate (requests with status < 500 / total)
      - record: slo:sli:success_rate:ratio_rate5m
        expr: |
          sum(rate(http_requests_total{namespace="sample-app"}[5m]))
          /
          sum(rate(http_requests_total{namespace="sample-app"}[5m]))

      # SLO Target: 99.9% availability
      - record: slo:target:availability
        expr: 0.999

      # Error Budget: (1 - SLI) * total requests
      - record: slo:error_budget_remaining:ratio
        expr: |
          (1 - slo:sli:success_rate:ratio_rate5m) / (1 - slo:target:availability)

      # Burn rate
      - record: slo:burn_rate:ratio_rate1h
        expr: |
          (1 - slo:sli:success_rate:ratio_rate5m) / (1 - slo:target:availability)

  - name: slo-alerts
    interval: 30s
    rules:
      - alert: SLOTargetBreach
        expr: slo:sli:success_rate:ratio_rate5m < 0.99
        for: 2m
        labels:
          severity: critical
          namespace: sample-app
        annotations:
          summary: "SLO breach detected"
          description: "Success rate dropped below 99%"

      - alert: ErrorBudgetBurned
        expr: slo:error_budget_remaining:ratio < 0.5
        for: 1m
        labels:
          severity: critical
          namespace: sample-app
        annotations:
          summary: "Error budget burned"
          description: "More than 50% of error budget consumed"

      - alert: HighErrorRate
        expr: slo:sli:success_rate:ratio_rate5m < 0.95
        for: 1m
        labels:
          severity: critical
          namespace: sample-app
        annotations:
          summary: "High error rate"
          description: "Error rate exceeded 5%"
